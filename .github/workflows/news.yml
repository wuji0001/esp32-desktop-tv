name: Update Chinese news
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'publish_news.py'
      - 'esp32_news_feed.py'
      - 'requirements.txt'
      - '.github/workflows/news.yml'
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: esp32-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python test_esp32_news_feed.py
      - run: python publish_news.py
      - name: Save public news cache when content changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/source_cache.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update public news cache'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy news
        id: deployment
        uses: actions/deploy-pages@v4
